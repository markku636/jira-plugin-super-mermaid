# Confluence 版 Super Mermaid —— 刻意是「第二個獨立的 Forge app」。
#
# 為什麼不跟 Jira 版共用一個 app:
# 跨產品(app.compatibility 同時宣告 jira + confluence)的 Forge app
# 【不支援免費 listing】。拆成兩個單產品 app,兩邊都能免費上架。
# 代價是兩份 Marketplace listing 與兩次審核。
#
# 這個目錄自己是一個 Forge app,forge 指令要在 confluence/ 底下跑。
# Custom UI 原始碼共用 ../static/panel/src(以相對路徑 import),不重複維護。

modules:
  macro:
    - key: super-mermaid-macro
      resource: macro
      resolver:
        function: resolver
      title: Super Mermaid
      description: Render Mermaid diagrams inline in your page.
      icon: resource:icons;icon.svg
      # block = 獨立區塊(預設)。Jira 只能側邊面板,Confluence 這裡能真正嵌在內文。
      layout: block
      # 刻意【不】設 viewportSize。官方文件明講:設了它就會關閉自動調整高度。
      # 設 large 的後果是 macro 被鎖成一個固定大框,圖表下方留一大塊空白,
      # 在文件裡看起來像貼了一塊突兀的黑色區塊。省略才會依內容自動縮放。
      categories:
        - visuals
        - formatting
      config:
        resource: config
        # 刻意【不】宣告 parameters。
        # 宣告的 parameters 是給 UI Kit 自動生成設定表單用的,而且會驗證 payload;
        # mermaid 原始碼是多行文字,type: string 的驗證會擋下來(Save 出錯的成因)。
        # Custom UI 的設定面板自己畫,view.submit() 給什麼就原樣存進 guestParams。
        #
        # 原始碼存在 macro 參數裡,跟著頁面版本走 —— 不用 Forge storage,
        # 因為圖表屬於這一頁,複製頁面時該一起被複製。
  function:
    - key: resolver
      handler: index.handler

resources:
  # 同一個 Vite 專案兩個 entry,輸出成兩個子目錄各自帶 index.html
  - key: macro
    path: static/ui/build/macro
  - key: config
    path: static/ui/build/config
  - key: icons
    # 必須是 app 目錄【內】的路徑。指向 ../resources 會逃出 app root,
    # 跟 build/macro/index.html 引用 ../assets/ 是同一類問題(deploy 不會擋,線上才壞)。
    path: resources

permissions:
  scopes:
    # 內嵌編輯用:在檢視頁面時直接改圖,不必進設定面板。
    # 做法是讀回頁面 ADF、改掉這個 macro 的 guestParams.source、再寫回去。
    # macro 檢視端無法用 view.submit()(那只在設定面板可用),所以只能走 REST。
    # 注意:scopes 不影響 Runs on Atlassian —— 失格條件是對外傳輸,不是權限。
    - read:page:confluence
    - write:page:confluence
  content:
    styles:
      # 同 Jira 版:mermaid 會往 SVG 塞 <style>,lib 也有 4 處 createElement('style')。
      # Forge Custom UI 預設 style-src 'self' 會擋掉。已查證不影響 Runs on Atlassian。
      - 'unsafe-inline'

# ⚠️ 同樣刻意沒有 permissions.external —— 那是 Runs on Atlassian 的命脈。
# scopes 只有上面那兩個(read/write:page:confluence),而且只為了「在檢視頁面直接編輯」
# 而存在(見 savePageMacro.ts)。改動這裡務必同步 docs/PRIVACY.md 的 Permissions 段
# 與 docs/LISTING-COPY.md 的描述 —— 安裝同意畫面會把 scope 列給使用者看,
# 說法對不上 manifest 是 Marketplace 退件的典型理由。

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/fd93a1d5-8b3a-4a6d-8785-61624b4b8fe0
